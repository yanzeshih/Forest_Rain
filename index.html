<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a08">
<title>入山聽雨</title>
<style>
:root{--ink:rgba(228,216,192,.8);--amb:#d9a55c}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#070a08;overflow:hidden;color:var(--ink);font-family:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#veil{position:fixed;inset:0;background:#050806;z-index:4;pointer-events:none;transition:opacity 7s ease}
#start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity 2.2s ease;text-align:center}
#ld{font-size:14px;letter-spacing:.5em;opacity:.6;transition:opacity 1s}
#ld::after{content:"";display:block;width:90px;height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--amb),transparent);animation:ld 2.4s ease-in-out infinite}
@keyframes ld{50%{opacity:.15;transform:scaleX(.4)}}
#go,#hp{opacity:0;transition:opacity 2s;pointer-events:none}
#go.r,#hp.r{opacity:1;pointer-events:auto}
#hp.r{opacity:.4;pointer-events:none}
#go{all:unset;cursor:pointer;font:inherit;font-size:22px;letter-spacing:.7em;padding:14px 8px 14px 24px;border-bottom:1px solid rgba(217,165,92,.5);color:#eadcc0;opacity:0;transition:opacity 2s,border-color .6s,letter-spacing .8s}
#go.r{opacity:.92}#go:hover,#go:focus-visible{border-color:var(--amb);letter-spacing:.8em}
#hp{font-size:12px;letter-spacing:.3em}
#txt{position:fixed;left:0;right:0;top:33%;z-index:2;text-align:center;padding:0 1em 0 1.5em;font-size:clamp(17px,2.6vw,25px);letter-spacing:.5em;line-height:2;opacity:0;transition:opacity 5s ease;pointer-events:none;text-shadow:0 0 16px #000,0 0 3px #000}
#ui{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;flex-wrap:wrap;justify-content:center;gap:0 20px;padding:0 10px calc(10px + env(safe-area-inset-bottom));font-size:13px;letter-spacing:.16em;opacity:0;pointer-events:none;transition:opacity 1.8s ease;text-shadow:0 0 8px #000,0 1px 2px #000;background:linear-gradient(transparent,rgba(5,7,5,.5))}
#ui.on{opacity:1;pointer-events:auto;transition-duration:.9s}
.g{display:flex;align-items:center}.g>i{font-style:normal;opacity:.4;margin-right:3px}
#ui button{all:unset;cursor:pointer;padding:9px 7px;opacity:.55;border-bottom:1px solid transparent;transition:opacity .4s,border-color .4s}
#ui button:hover,#ui button:focus-visible{opacity:.95}#ui button.a{opacity:1;border-color:var(--amb)}
#mix{flex-basis:100%;justify-content:center;gap:18px;flex-wrap:wrap;padding-bottom:4px}#mix[hidden]{display:none}
#mix label{display:flex;align-items:center;gap:8px;opacity:.85}
input[type=range]{-webkit-appearance:none;appearance:none;width:92px;height:22px;background:linear-gradient(var(--ink),var(--ink)) center/100% 1px no-repeat;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:5px;height:13px;background:var(--amb);border:0}
input[type=range]::-moz-range-thumb{width:5px;height:13px;background:var(--amb);border:0;border-radius:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="txt"></div>
<div id="veil"></div>
<div id="start">
  <div id="ld">正在鋪開山林…</div>
  <button id="go">入山聽雨</button>
  <p id="hp">建議戴上耳機，調暗四周的燈</p>
</div>
<div id="ui">
  <div class="g"><i>雨</i><button data-i="0">小雨</button><button data-i="1" class="a">中雨</button><button data-i="2">大雨</button></div>
  <div class="g"><i>光</i><button data-t="0" class="a">清晨</button><button data-t="1">黃昏</button><button data-t="2">深夜</button></div>
  <div class="g"><i>時</i><button data-m="15">15 分</button><button data-m="30">30 分</button><button data-m="60">60 分</button></div>
  <div class="g"><button id="mixb">音量</button><button id="fs">全螢幕</button><button id="im">隱藏介面</button></div>
  <div class="g" id="mix" hidden>
    <label>雨聲<input type="range" id="vr" min="0" max="1" step=".01" value=".8"></label>
    <label>森林<input type="range" id="vf" min="0" max="1" step=".01" value=".6"></label>
    <label>古琴<input type="range" id="vq" min="0" max="1" step=".01" value=".7"></label>
  </div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cv=$('#c'),X=cv.getContext('2d'),ui=$('#ui'),txt=$('#txt'),veil=$('#veil');
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const COARSE=matchMedia('(pointer:coarse)').matches;
const S={I:1,T:0,lamp:1,lampK:1,steam:.3,live:0,done:0,im:0};
const PAL=[{t:[205,226,228],g:[205,235,225,.07],b:1,lk:.25,bd:1},{t:[232,176,132],g:[255,150,70,.17],b:.75,lk:.55,bd:.5},{t:[34,50,82],g:[0,0,0,0],b:.34,lk:1,bd:0}];
const P={t:[...PAL[0].t],g:[...PAL[0].g],b:1,lk:.25,bd:1};
let W,H,u,DPR,Mx,My,AX,AY,hz,eY,LY={},RN=[],LV=[],DP=[],RP=[],ST=[],fog,puff,cup={x:0,y:0},lamp={x:0,y:0},PUD={},FX=0,FY=0;
const BR=[[1.03,.30,.86,.2,.64,.36],[.08,.43,.2,.33,.33,.45]];

/* ---------- 場景預繪 ---------- */
function build(){
  DPR=Math.min(devicePixelRatio||1,1.5);W=cv.width=innerWidth*DPR|0;H=cv.height=innerHeight*DPR|0;
  u=Math.min(W,H*1.1)/100;Mx=W*.02|0;My=H*.02|0;AX=W*.015;AY=H*.012;hz=.62*H;eY=.13*H;
  const lw=W+2*Mx,lh=H+2*My;
  const lay=f=>{const c=mk(lw,lh),g=c.getContext('2d');g.translate(Mx,My);f(g);return c};
  const fir=(g,x,y,h,w)=>{const n=9,p=[];for(let i=1;i<=n;i++){const t=i/n,yy=y-h+h*t,ww=w*t*.5*(.8+Math.random()*.4);p.push([ww,yy,ww*.45,yy+h/n*.55])}
    g.beginPath();g.moveTo(x,y-h);p.forEach(a=>{g.lineTo(x+a[0],a[1]);g.lineTo(x+a[2],a[3])});g.lineTo(x+w*.03,y);g.lineTo(x-w*.03,y);
    for(let i=n-1;i>=0;i--){const a=p[i];g.lineTo(x-a[2],a[3]);g.lineTo(x-a[0],a[1])}g.closePath();g.fill()};
  LY.a=lay(g=>{g.fillStyle='rgb(156,171,164)';for(let i=0;i<70;i++){const h=rnd(14,30)*u;fir(g,rnd(-Mx,W+Mx),hz+rnd(u*3),h,h*.36)}g.fillRect(-Mx,hz+u*3,lw,H)});
  LY.b=lay(g=>{g.fillStyle='rgb(108,129,118)';for(let i=0;i<38;i++){const h=rnd(26,52)*u;fir(g,rnd(-Mx,W+Mx),.67*H+rnd(u*3),h,h*.34)}g.fillRect(-Mx,.67*H+u*3,lw,H)});
  LY.c=lay(g=>{
    [.04,.22,.4,.58,.74,.93].forEach(x0=>{const x=(x0+rnd(-.04,.04))*W,wb=rnd(3.5,6.5)*u,by=.77*H+rnd(u*2);
      const gr=g.createLinearGradient(x-wb,0,x+wb,0);gr.addColorStop(0,'rgb(40,52,45)');gr.addColorStop(.6,'rgb(58,74,64)');gr.addColorStop(1,'rgb(36,46,40)');
      g.fillStyle=gr;g.beginPath();g.moveTo(x-wb/2,by);g.lineTo(x-wb*.38,-My);g.lineTo(x+wb*.38,-My);g.lineTo(x+wb/2,by);g.fill();
      g.beginPath();g.moveTo(x-wb*.5,by-4*u);g.quadraticCurveTo(x-wb*.6,by,x-wb*1.1,by+1.5*u);g.lineTo(x+wb*1.1,by+1.5*u);g.quadraticCurveTo(x+wb*.6,by,x+wb*.5,by-4*u);g.fill();
      for(let i=0;i<16;i++){g.fillStyle=`rgba(${70+rnd(30)|0},${112+rnd(30)|0},${60+rnd(20)|0},${rnd(.25,.55)})`;g.beginPath();g.ellipse(x+rnd(-wb*.45,wb*.45),by-rnd(0,16)*u,rnd(.5,1.4)*u,rnd(1,4)*u,0,0,7);g.fill()}
      g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1;for(let i=0;i<5;i++){const xx=x+rnd(-wb*.3,wb*.3);g.beginPath();g.moveTo(xx,by);g.lineTo(xx+rnd(-u,u),by-rnd(10,40)*u);g.stroke()}});
    BR.forEach(b=>{g.strokeStyle='rgb(36,32,28)';g.lineWidth=1.1*u;g.beginPath();g.moveTo(b[0]*W,b[1]*H);g.quadraticCurveTo(b[2]*W,b[3]*H,b[4]*W,b[5]*H);g.stroke()})});
  PUD={x:.5*W,y:.835*H,rx:.25*W,ry:.04*H};
  LY.d=lay(g=>{
    let gr=g.createLinearGradient(0,.67*H,0,H);gr.addColorStop(0,'rgba(92,110,96,0)');gr.addColorStop(.12,'rgba(70,88,74,.95)');gr.addColorStop(1,'rgb(26,36,29)');g.fillStyle=gr;g.fillRect(-Mx,.67*H,lw,H);
    for(let i=0;i<280;i++){const x=rnd(-Mx,W+Mx),y=rnd(.72*H,H);g.strokeStyle=`rgba(${60+rnd(40)|0},${100+rnd(50)|0},${60+rnd(20)|0},${rnd(.15,.4)})`;g.lineWidth=rnd(.2,.5)*u;g.beginPath();g.moveTo(x,y);g.lineTo(x+rnd(-1,1)*u,y-rnd(1,3)*u);g.stroke()}
    for(let i=0;i<7;i++){const sx=rnd(W),ex=sx+rnd(-12,12)*u;g.strokeStyle='rgb(40,34,29)';g.lineWidth=rnd(1,2.2)*u;g.beginPath();g.moveTo(sx,.77*H);g.quadraticCurveTo(sx+rnd(-5,5)*u,.84*H,ex,.9*H);g.stroke();
      g.strokeStyle='rgba(98,140,74,.4)';g.lineWidth=.6*u;g.beginPath();g.moveTo(sx,.77*H-.5*u);g.quadraticCurveTo(sx+rnd(-5,5)*u,.84*H-.5*u,ex,.9*H-.5*u);g.stroke()}
    gr=g.createLinearGradient(0,PUD.y-PUD.ry,0,PUD.y+PUD.ry);gr.addColorStop(0,'rgba(190,204,200,.88)');gr.addColorStop(1,'rgba(92,108,104,.88)');
    g.fillStyle=gr;g.beginPath();g.ellipse(PUD.x,PUD.y,PUD.rx,PUD.ry,0,0,7);g.fill();g.strokeStyle='rgba(22,32,24,.55)';g.lineWidth=.5*u;g.stroke();
    for(let i=0;i<8;i++){const x=rnd(W),y=rnd(.77,.9)*H,rx=rnd(3,7)*u,ry=rx*.55;if(Math.abs(x-PUD.x)<PUD.rx*.9&&Math.abs(y-PUD.y)<PUD.ry*2)continue;
      g.fillStyle='rgb(62,68,64)';g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();g.fillStyle='rgba(94,134,72,.78)';g.beginPath();g.ellipse(x,y-ry*.35,rx*.9,ry*.6,0,0,7);g.fill();
      g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=1;g.beginPath();g.ellipse(x,y,rx*.85,ry*.8,0,3.5,5.6);g.stroke()}});
  cup={x:.62*W,y:.95*H,s:1.2*u};lamp.x=.84*W;
  LY.f=lay(g=>{
    let gr=g.createLinearGradient(0,.905*H,0,H);gr.addColorStop(0,'rgb(66,50,38)');gr.addColorStop(1,'rgb(28,21,16)');g.fillStyle=gr;g.fillRect(-Mx,.905*H,lw,H);
    for(let i=1;i<6;i++){const y=.905*H+H*.095*Math.pow(i/6,1.3);g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=1+i*.3;g.beginPath();g.moveTo(-Mx,y);g.lineTo(W+Mx,y);g.stroke()}
    for(let i=0;i<60;i++){const y=rnd(.91,1)*H,x=rnd(-Mx,W);g.strokeStyle='rgba(0,0,0,.15)';g.beginPath();g.moveTo(x,y);g.lineTo(x+rnd(5,30)*u,y);g.stroke()}
    const px=.03*W,pw=7*u;gr=g.createLinearGradient(px,0,px+pw,0);gr.addColorStop(0,'rgb(52,38,28)');gr.addColorStop(.55,'rgb(88,65,46)');gr.addColorStop(1,'rgb(46,34,25)');
    g.fillStyle=gr;g.fillRect(px,-My,pw,.915*H+My);
    for(let i=0;i<46;i++){const x=px+rnd(pw);g.strokeStyle=`rgba(0,0,0,${rnd(.08,.22)})`;g.lineWidth=rnd(.5,1.6);g.beginPath();g.moveTo(x,-My);g.bezierCurveTo(x+rnd(-u,u),.3*H,x+rnd(-u,u),.6*H,x+rnd(-.5,.5)*u,.915*H);g.stroke()}
    g.fillStyle='rgba(255,255,255,.07)';g.fillRect(px+pw*.78,-My,pw*.06,H);
    for(let i=0;i<30;i++){g.fillStyle=`rgba(${78+rnd(24)|0},${112+rnd(30)|0},${60+rnd(16)|0},${rnd(.25,.6)})`;g.beginPath();g.ellipse(px+rnd(pw),rnd(.8,.915)*H,rnd(.6,1.6)*u,rnd(.6,2)*u,0,0,7);g.fill()}
    gr=g.createLinearGradient(0,-My,0,eY);gr.addColorStop(0,'rgb(10,7,5)');gr.addColorStop(1,'rgb(44,32,24)');g.fillStyle=gr;g.fillRect(-Mx,-My,lw,eY+My);
    for(let i=0;i<16;i++){const xb=(i/15)*lw-Mx;g.strokeStyle='rgba(0,0,0,.42)';g.lineWidth=1.3*u;g.beginPath();g.moveTo(W/2+(xb-W/2)*.62,-My);g.lineTo(xb,eY);g.stroke()}
    g.fillStyle='rgb(76,56,41)';g.fillRect(-Mx,eY-3.4*u,lw,3.4*u);
    for(let i=0;i<40;i++){g.strokeStyle=`rgba(0,0,0,${rnd(.1,.3)})`;g.lineWidth=rnd(.4,1.1);const y=eY-rnd(3.2*u);const x=rnd(-Mx,W);g.beginPath();g.moveTo(x,y);g.lineTo(x+rnd(8,40)*u,y+rnd(-.2,.2)*u);g.stroke()}
    g.fillStyle='rgba(255,255,255,.1)';g.fillRect(-Mx,eY-.25*u,lw,.25*u);
    gr=g.createLinearGradient(0,eY,0,eY+4*u);gr.addColorStop(0,'rgba(0,0,0,.4)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(-Mx,eY,lw,4*u);
    // 茶杯
    const cx=cup.x,cy=cup.y,s=cup.s;g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.ellipse(cx+s*.4,cy+s*.2,s*4.2,s*.9,0,0,7);g.fill();
    g.fillStyle='rgb(92,86,74)';g.beginPath();g.ellipse(cx,cy,s*3.9,s*.95,0,0,7);g.fill();
    g.fillStyle='rgb(134,148,136)';g.beginPath();g.moveTo(cx-s*3,cy-s*3);g.quadraticCurveTo(cx-s*2.7,cy,cx-s*1.5,cy);g.lineTo(cx+s*1.5,cy);g.quadraticCurveTo(cx+s*2.7,cy,cx+s*3,cy-s*3);g.fill();
    g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.moveTo(cx+s*.9,cy-s*2.9);g.quadraticCurveTo(cx+s*1.3,cy,cx+s*1.5,cy);g.lineTo(cx+s*2.5,cy);g.quadraticCurveTo(cx+s*2.7,cy,cx+s*3,cy-s*3);g.fill();
    g.fillStyle='rgb(168,180,168)';g.beginPath();g.ellipse(cx,cy-s*3,s*3,s*.85,0,0,7);g.fill();
    g.fillStyle='rgb(150,112,52)';g.beginPath();g.ellipse(cx,cy-s*2.95,s*2.6,s*.64,0,0,7);g.fill();
    g.fillStyle='rgba(255,230,170,.35)';g.beginPath();g.ellipse(cx-s*.6,cy-s*3.05,s*.9,s*.2,0,0,7);g.fill()});
  // 霧
  fog=mk(W,H*.4|0);const fg=fog.getContext('2d');
  for(let i=0;i<24;i++){const x=rnd(W),y=rnd(fog.height*.25,fog.height*.8),r=rnd(.12,.3)*W;for(const o of[-W,0,W]){const gr=fg.createRadialGradient(x+o,y,0,x+o,y,r);gr.addColorStop(0,'rgba(236,242,238,.42)');gr.addColorStop(1,'rgba(236,242,238,0)');fg.fillStyle=gr;fg.fillRect(x+o-r,y-r,r*2,r*2)}}
  puff=mk(64,64);const pg=puff.getContext('2d'),gr=pg.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(240,240,232,1)');gr.addColorStop(1,'rgba(240,240,232,0)');pg.fillStyle=gr;pg.fillRect(0,0,64,64);
  // 雨層
  const mkR=(n,len,v,w,a,top,lim,rp)=>({n,len,v,w,a,top,lim,rp,p:Array.from({length:n},()=>({x:rnd(-.1*W,1.1*W),y:rnd(top*H,lim*H),m:rnd(.85,1.15)}))});
  RN=[mkR(300,2.4,85,.55*DPR,.13,.08,.66,0),mkR(170,5.5,135,DPR,.2,.1,.8,.04),mkR(70,11,200,1.6*DPR,.3,.13,.87,.07)];
  // 葉片
  LV=[];const leaf=(x,y,a,len,dep)=>LV.push({x,y,a,len,wid:len*.42,dep,ph:rnd(6.3),k:0,vk:0,c:`hsl(${135+rnd(-12,12)|0},${rnd(28,42)|0}%,${rnd(20,32)|0}%)`});
  BR.forEach(b=>{for(let i=0;i<24;i++){const t=rnd(.12,1),q=1-t,x=(q*q*b[0]+2*q*t*b[2]+t*t*b[4])*W,y=(q*q*b[1]+2*q*t*b[3]+t*t*b[5])*H;leaf(x,y,Math.PI/2+rnd(-1.3,1.3),rnd(3,5.2)*u,.5)}});
  [[.2,.9,1.1],[.92,.86,1],[.55,.79,.7],[.36,.92,.8]].forEach(([fx,fy,sc])=>{for(let i=0;i<10;i++)leaf(fx*W+rnd(-u,u),fy*H,-Math.PI/2+(i-4.5)/4.5*1.1+rnd(-.1,.1),rnd(5,8)*u*sc,.65)});
  // 屋簷水滴
  DP=[];for(let i=0;i<11;i++){let x=(.1+.88*i/10)*W+rnd(-2,2)*u;if(Math.abs(x-.84*W)<4*u)x+=6*u;DP.push({x,s:0,tm:rnd(4),dur:rnd(3,9),r:0,y:0,v:0,ly:rnd(.76,.87)*H})}
}

/* ---------- 聲音 ---------- */
let ac,AU={};
function initAudio(){
  ac=new(window.AudioContext||window.webkitAudioContext)();
  const G=(v,to)=>{const g=ac.createGain();g.gain.value=v;if(to)g.connect(to);return g};
  const m=G(.9,ac.destination),rB=G(.64,m),fB=G(.36,m),qB=G(.49,m);
  const farS=G(0,rB),nearS=G(0,rB),forS=G(0,fB),qS=G(0,qB);
  const nb=ac.createBuffer(1,ac.sampleRate*6|0,ac.sampleRate),d=nb.getChannelData(0);let b0=0,b1=0,b2=0;
  for(let i=0;i<d.length;i++){const w=Math.random()*2-1;b0=.99765*b0+w*.099;b1=.963*b1+w*.2965;b2=.57*b2+w*1.05;d[i]=(b0+b1+b2+w*.18)*.11}
  const nz=(type,f,q,to,gv)=>{const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=G(gv);s.connect(fl);fl.connect(g);g.connect(to);s.start(0,Math.random()*5);return{g,fl}};
  const lfo=(f,dp,p)=>{const o=ac.createOscillator();o.frequency.value=f;o.connect(G(dp,p));o.start()};
  AU={m,rB,fB,qB,farS,nearS,forS,qS,
    hiss:nz('bandpass',1800,.35,farS,0),leaf:nz('highpass',5200,.6,farS,0),roof:nz('bandpass',3300,.7,nearS,0),rum:nz('lowpass',380,.5,nearS,0)};
  lfo(.37,.012,AU.roof.g.gain);lfo(.17,.008,AU.hiss.g.gain);
  const wd=nz('bandpass',380,.6,forS,.08),rs=nz('highpass',3400,.7,forS,.04),st=nz('bandpass',1100,1.1,forS,.03);nz('bandpass',2600,2,forS,.01);
  lfo(.07,.05,wd.g.gain);lfo(.05,140,wd.fl.frequency);lfo(.13,.03,rs.g.gain);lfo(.21,.008,st.g.gain);

function im(on){S.im=on;ui.classList.remove('on');if(on)say('輕點兩下，回到介面',1)}
$('#im').onclick=()=>im(1);
addEventListener('keydown',e=>{if(e.key=='h'||e.key=='H')im(!S.im);if(e.key=='Escape'&&S.im)im(0)});
// 計時
let tEnd=0,tM=0;const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1e3));return(s/60|0)+':'+String(s%60).padStart(2,'0')};
function upT(){$$('[data-m]').forEach(b=>{const on=+b.dataset.m==tM;b.classList.toggle('a',on);b.textContent=on&&tEnd?fmt(tEnd-Date.now()):b.dataset.m+' 分'})}
$$('[data-m]').forEach(b=>b.onclick=()=>{const m=+b.dataset.m;if(tM==m){tM=0;tEnd=0}else{tM=m;tEnd=Date.now()+m*6e4}upT()});
setInterval(()=>{if(tEnd){if(Date.now()>=tEnd){tEnd=0;tM=0;finish()}upT()}},1000);
function finish(){S.done=1;ac.resume();AU.m.gain.setTargetAtTime(0,ac.currentTime,9);veil.style.transition='opacity 28s linear';veil.style.opacity=.95;ui.classList.remove('on');
  setTimeout(()=>{if(S.done){S.im=0;txt.textContent='雨還在下，你可以安心離開了。';txt.style.opacity=.7}},20000)}
function resume(){S.done=0;AU.m.gain.setTargetAtTime(.9,ac.currentTime,1.5);veil.style.transition='opacity 3s ease';veil.style.opacity=0;txt.style.opacity=0;wake()}
// 視差與點擊
addEventListener('pointermove',e=>{if(e.pointerType=='mouse'){ptr.x=(e.clientX/innerWidth-.5)*2;ptr.y=(e.clientY/innerHeight-.5)*2;wake()}});
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;gy.on=1;gy.x=cl(e.gamma/22,-1,1);gy.y=cl(((e.beta||0)-50)/22,-1,1)});
document.addEventListener('pointerdown',e=>{const n=Date.now();if(S.done){resume();return}if(S.im&&n-lt<400)im(0);lt=n;wake()});
cv.addEventListener('pointerdown',e=>{if(!S.live||S.done)return;const x=e.clientX*DPR,y=e.clientY*DPR;
  if(Math.hypot(x-(cup.x+FX),y-(cup.y+FY-cup.s*3))<8*u)S.steam=1;
  else if(Math.hypot(x-lamp.x,y-lamp.y)<7*u){S.lamp^=1;tick()}});
// 入山
$('#go').onclick=()=>{$('#go').disabled=true;initAudio();ac.resume();const t0=ac.currentTime,A=AU;S.live=1;
  $('#start').style.opacity=0;setTimeout(()=>$('#start').remove(),2300);veil.style.opacity=0;
  A.farS.gain.setTargetAtTime(1,t0,2.5);
  setTimeout(()=>A.nearS.gain.setTargetAtTime(1,ac.currentTime,3),4000);
  setTimeout(()=>{A.forS.gain.setTargetAtTime(1,ac.currentTime,4);bird()},7000);
  setTimeout(()=>{A.qS.gain.setTargetAtTime(1,ac.currentTime,4);phrase()},16000);
  setTimeout(()=>say(PH[0]),11000);setTimeout(()=>say('茶杯與燈，都可以輕觸。'),32000);setTimeout(phr,70000);
  setTimeout(wake,8000);
  if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().catch(()=>{})};
// 載入
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(build,200)});
requestAnimationFrame(()=>setTimeout(()=>{build();requestAnimationFrame(frame);$('#ld').style.opacity=0;setTimeout(()=>{$('#ld').style.display='none';$('#go').classList.add('r');$('#hp').classList.add('r')},900)},80));
</script>
